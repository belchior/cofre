<!doctype html>
<html lang="pt-br">

<head>
  <title>Cofre</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#222222" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="last-version" content="0.0.0" />

  <link rel="icon" type="image/svg+xml" sizes="any" href="src/logoIcon.svg" />
  <link rel="icon" type="image/svg+xml" sizes="128x128" href="src/logoIcon.svg" />
  <link rel="icon" type="image/svg+xml" sizes="512x512" href="src/logoIcon.svg" />
  <link rel="apple-touch-icon" sizes="128x128" href="src/logoIcon.svg" />
  <link rel="manifest" href="src/manifest.json" />

  <script type="module" vite-ignore>
    (() => {
      let vs = window.localStorage.getItem('version')
      if (vs == null) {
        vs = document.querySelector('meta[name="last-version"]').content
        window.localStorage.setItem('version', vs)
      }
      if (navigator.maxTouchPoints > 0) document.body.classList.add('touch')
      if (location.hostname === 'localhost') return
      const s = document.createElement('script')
      s.type = 'module'
      s.crossOrigin = true
      s.src = `/cofre/assets/index-${vs}.js`
      document.head.appendChild(s)
      const st = document.createElement('link')
      st.rel = 'stylesheet'
      st.crossOrigin = true
      st.href = `/cofre/assets/index-${vs}.css`
      document.head.appendChild(st)
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
